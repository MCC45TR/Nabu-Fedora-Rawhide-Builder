# Load the platform XHCI host after switch-root; xhci_hcd is pulled in as a
# dependency. USB is optional for the UFS-backed Nabu boot path.
xhci_plat_hcd
# The ESP32-S3 is a composite HID + CDC device. Loading cdc_acm explicitly
# after switch-root avoids relying on a late modalias event to create ttyACM.
cdc_acm
