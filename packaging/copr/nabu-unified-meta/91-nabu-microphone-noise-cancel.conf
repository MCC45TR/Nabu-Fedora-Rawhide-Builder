# Keep the optional WebRTC microphone graph passive until an application uses
# it. The raw two-channel microphone remains available unchanged.
pulse.cmd = [
    { cmd = "load-module"
      args = "module-echo-cancel aec_method=webrtc source_name=nabu_noise_cancelled_mic source_properties='device.description=Noise_Cancelled_Internal_Microphones node.pause-on-idle=true node.passive=true' sink_name=nabu_aec_sink sink_properties='node.pause-on-idle=true node.passive=true'"
      flags = [ nofail ]
    }
]
