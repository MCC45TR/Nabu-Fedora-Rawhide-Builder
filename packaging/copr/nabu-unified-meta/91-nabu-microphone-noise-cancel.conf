# Keep the physical two-channel Nabu microphone available unchanged and expose
# an additional WebRTC-processed source for calls and recordings.
pulse.cmd = [
    { cmd = "load-module"
      args = "module-echo-cancel aec_method=webrtc source_name=nabu_noise_cancelled_mic source_properties=device.description=Noise_Cancelled_Internal_Microphones sink_name=nabu_aec_sink"
      flags = [ nofail ]
    }
]
