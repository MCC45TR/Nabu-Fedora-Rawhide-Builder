# Nabu exposes one user-facing speaker and one raw two-channel microphone.
# The orientation-aware filter consumes the hardware speaker sink internally.
# Keep that ALSA node linkable while hiding it from device selectors, where the
# public nabu_screen_speakers node is the sole built-in output.
monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "alsa_output.platform-sound.HiFi__Speaker__sink"
      }
    ]
    actions = {
      update-props = {
        node.hidden = true
      }
    }
  }
]
