# Nabu exposes one user-facing speaker and one raw two-channel microphone.
# feedbackd's role-policy loopbacks remain useful on phones, but on this tablet
# they are presented by desktop mixers as separate physical output devices.
# This fragment is installed in /etc, whose profile values override all
# distribution fragments after those fragments have been merged.
wireplumber.profiles = {
  main = {
    policy.linking.role-based.loopbacks = disabled
  }
}

# Only legacy four-channel kernels need the orientation filter. The stereo
# I2S backend is a normal visible ALSA sink, feeding four physical amplifiers.
monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "alsa_output.platform-sound.HiFi__Speaker__sink"
        audio.channels = 4
      }
    ]
    actions = {
      update-props = {
        node.hidden = true
      }
    }
  }
  {
    matches = [
      {
        node.name = "alsa_output.platform-sound.HiFi__Speaker__sink"
        audio.channels = 2
      }
    ]
    actions = {
      update-props = {
        node.hidden = false
      }
    }
  }
]
