[Unit]
# The stock 3 second restart delay never reaches its 5 starts/10 second rate
# limit.  A failed ADSP attach can otherwise retry forever and keep dependent
# audio/desktop processes stuck during shutdown.
StartLimitIntervalSec=60s
StartLimitBurst=4

[Service]
Restart=on-failure
RestartSec=5s
TimeoutStopSec=8s
TimeoutStopFailureMode=kill
