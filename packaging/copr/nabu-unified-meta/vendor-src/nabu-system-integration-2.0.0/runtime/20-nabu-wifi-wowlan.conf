# WCN3990 ath10k_snoc supports these selective wake triggers once the kernel
# declares the SNOC device wake-capable. 12 is disconnect (0x4) plus magic
# packet (0x8); ordinary packets are not requested as wake triggers.
#
# Fedora defaults associated Wi-Fi connections to a stable address derived
# from the SSID. Nabu already exposes a stable SoC-derived permanent address,
# so use that identity for every profile unless the user explicitly overrides
# the cloned-mac-address setting in the connection itself.
[connection-nabu-wifi]
match-device=type:wifi
wifi.wake-on-wlan=12
wifi.cloned-mac-address=permanent
