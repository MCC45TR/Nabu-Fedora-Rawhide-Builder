# Nabu images are device-specific and carry a single hardware stack.  A
# host-only initramfs avoids probing desktop/server storage modules on every
# boot while the explicit UFS and DTB requirements below stay fail-closed.
hostonly="yes"
force_drivers+=" ufs_qcom ufshcd_pltfrm phy_qcom_qmp_ufs "
add_dracutmodules+=" nabu-dtb "
install_items+=" /usr/lib/firmware/regulatory.db /usr/lib/firmware/regulatory.db.p7s /usr/lib/firmware/qca/crbtfw32.tlv /usr/lib/firmware/qca/crnv32.bin "
