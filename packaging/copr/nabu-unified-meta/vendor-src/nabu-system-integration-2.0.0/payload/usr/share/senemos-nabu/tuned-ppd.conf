[main]
# Keep the freedesktop PowerProfiles API stable while mapping it to profiles
# designed for the Snapdragon 860 tablet rather than generic server profiles.
default=balanced
battery_detection=true
sysfs_acpi_monitor=false

[profiles]
power-saver=senemos-nabu-power-saver
balanced=senemos-nabu-balanced
performance=senemos-nabu-performance

[battery]
balanced=senemos-nabu-balanced-battery
