[main]
summary=Balanced performance and battery life for Xiaomi Pad 5 (nabu)

[cpu]
governor=schedutil

[sysctl]
kernel.sched_autogroup_enabled=1

[sysfs]
# Android's Nabu Power HAL uses 2.8416 GHz as the normal prime-core ceiling.
# Select the board policy through the standard kernel class. The direct limits
# below remain a matching fallback for older installed 6.17/7.2 kernels.
/sys/class/platform-profile/platform-profile-0/profile=balanced
/sys/devices/system/cpu/cpufreq/policy0/scaling_max_freq=1785600
/sys/devices/system/cpu/cpufreq/policy4/scaling_max_freq=2419200
/sys/devices/system/cpu/cpufreq/policy7/scaling_max_freq=2841600
/sys/class/devfreq/2c00000.gpu/min_freq=257000000
/sys/class/devfreq/2c00000.gpu/max_freq=675000000
/sys/class/devfreq/2c00000.gpu/governor=simple_ondemand
