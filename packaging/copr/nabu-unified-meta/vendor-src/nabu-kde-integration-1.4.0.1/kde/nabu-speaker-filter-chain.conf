context.properties = {
    log.level = 0
}

context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.*       = support/libspa-support
}

context.modules = [
    { name = libpipewire-module-rt flags = [ ifexists nofail ] }
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-adapter }
    { name = libpipewire-module-filter-chain
        args = {
            node.description = "Built-in Audio Speakers"
            media.name = "Nabu screen-relative four-speaker output"
            filter.graph = {
                nodes = [
                    { type = builtin name = front_left  label = copy }
                    { type = builtin name = front_right label = copy }
                    { type = builtin name = rear_left   label = copy }
                    { type = builtin name = rear_right  label = copy }
                ]
                links = [
                ]
                inputs = [
                    "front_left:In"
                    "front_right:In"
                    "rear_left:In"
                    "rear_right:In"
                ]
                outputs = [
                    "front_left:Out"
                    "front_right:Out"
                    "rear_left:Out"
                    "rear_right:Out"
                ]
            }
            capture.props = {
                node.name = "nabu_screen_speakers"
                node.description = "Built-in Audio Speakers"
                media.class = "Audio/Sink"
                audio.position = [ FL FR RL RR ]
                priority.session = 2000
            }
            playback.props = {
                node.name = "playback.nabu_screen_speakers"
                media.class = "Stream/Output/Audio"
                audio.position = [ FL FR RL RR ]
                node.autoconnect = false
                node.dont-reconnect = true
                stream.dont-remix = true
                node.passive = true
            }
        }
    }
]
