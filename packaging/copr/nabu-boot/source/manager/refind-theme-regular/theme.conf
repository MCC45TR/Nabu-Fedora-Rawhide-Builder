# Nabu dark 2x profile for bobafetthotmail/refind-theme-regular.
#
# The kernel describes the built-in panel with rotation = <90>, yielding the
# tablet's normal 2560x1600 landscape workspace. Ask GOP for that same logical
# mode. GopRotate then applies 270 degrees counter-clockwise so that the menu
# has the same landscape orientation as the kernel's 90-degree panel property.
resolution 1600 2560

icons_dir themes/refind-theme-regular/icons/256-96
big_icon_size 256
small_icon_size 96

banner themes/refind-theme-regular/icons/256-96/bg_dark.png
selection_big themes/refind-theme-regular/icons/256-96/selection_dark-big.png
selection_small themes/refind-theme-regular/icons/256-96/selection_dark-small.png

# The upstream 14 px bitmap font corresponds to the 1x profile.
font themes/refind-theme-regular/fonts/source-code-pro-extralight-28.png
