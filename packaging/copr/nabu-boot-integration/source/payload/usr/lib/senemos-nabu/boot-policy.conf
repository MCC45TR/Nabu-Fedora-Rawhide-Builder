# Packaged, non-noreplace Nabu boot contract.  Local path and entry overrides
# remain in /etc/kernel/nabu-uki.conf, but safety-critical arguments update
# atomically with nabu-uki-config.
NABU_KERNEL_CMDLINE='root=PARTLABEL=linux rootfstype=ext4 ro rootwait rd.retry=30 deferred_probe_timeout=0 fw_devlink=permissive systemd.gpt_auto=no quiet splash fbcon=rotate:1 fbcon=font:TER16x32 selinux=1 enforcing=1'
